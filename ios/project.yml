name: BehaSetup
options:
  bundleIdPrefix: com.beha-community
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_STYLE: Automatic
targets:
  BehaSetup:
    type: application
    platform: iOS
    sources:
      - BehaSetup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beha-community.local-setup
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BehaSetup/Info.plist
      properties:
        CFBundleDisplayName: BEHA Local Setup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Connect to a nearby BEHA heater to configure its existing Wi-Fi and local MQTT broker.
        NSLocalNetworkUsageDescription: Verify your local MQTT broker and listen for fresh heater readings after setup.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: BEHA Setup Profile
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.beha-community.setup-profile
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.beha-community.setup-profile
            UTTypeDescription: BEHA Setup Profile
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - beha-setup
schemes:
  BehaSetup:
    build:
      targets:
        BehaSetup: all
